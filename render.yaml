services:
  - type: web
    name: wechat-resource-tracker-api
    env: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: RESOURCE_EXTRACTOR_LLM_ENABLED
        value: "false"
      - key: PYTHON_VERSION
        value: "3.12"
  - type: web
    name: wechat-resource-tracker-web
    env: node
    plan: free
    rootDir: apps/web
    buildCommand: npm install && npm run build
    startCommand: npm run start -- -p $PORT
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://wechat-resource-tracker-api.onrender.com
      - key: INTERNAL_API_BASE_URL
        value: https://wechat-resource-tracker-api.onrender.com
